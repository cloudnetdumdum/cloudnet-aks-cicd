name: CloudNet AKS CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: cloudnetacr
  ACR_LOGIN_SERVER: cloudnetacr.azurecr.io
  RESOURCE_GROUP: rg-devops-lab
  AKS_CLUSTER: cloudnet-aks
  IMAGE_NAME: cloudnet-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA} .

      - name: Push Docker Image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}

      - name: Install kubectl
        run: |
          az aks install-cli

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --admin \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl create namespace production \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/deployment.yaml

          kubectl set image deployment/cloudnet-web \
            cloudnet-web=$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA} \
            -n production

          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/cloudnet-web \
            -n production --timeout=180s

          kubectl get pods -n production

          kubectl get services -n production
